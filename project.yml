name: VFRRadioPractice
options:
  bundleIdPrefix: com.zikakis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  VFRCore:
    path: Packages/VFRCore

targets:
  VFRRadioPractice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    dependencies:
      - package: VFRCore
    info:
      path: App/Info.generated.plist
      properties:
        CFBundleDisplayName: VFR Radio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "VFR Radio listens to your radio calls so it can respond and grade your phraseology."
        NSSpeechRecognitionUsageDescription: "VFR Radio transcribes your spoken radio calls to understand and grade them."
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zikakis.vfrradio
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 854K32YB8L
